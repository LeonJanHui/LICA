  warmup_epochs: 5
  gradient_clip_norm: 1.0
  seed: 42
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  resume_existing: false
  deterministic: false
ablation:
  coord_update: true
  use_track_a: false
  use_track_b: true
  use_track_c: true
  param_match: false
  param_match_track: null
