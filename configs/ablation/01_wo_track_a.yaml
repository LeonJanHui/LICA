paths:
  root_dir: /home/dldx/Boltz-EGNN-Affinity/data/curated_pdbbind
  save_dir: /home/dldx/Boltz-EGNN-Affinity/data/processed/pyg_graphs
  ledger_json: /home/dldx/Boltz-EGNN-Affinity/data/similarity/PDBbind_split_mydata.json
  data_dict_json: /home/dldx/Boltz-EGNN-Affinity/data/similarity/PDBbind_data_dict.json
  save_model_dir: /home/dldx/Boltz-EGNN-Affinity/checkpoints/ablation_wo_track_a
dataset:
  train_split: train
  valid_split: valid
  test_split: casf2016
  label_col: log_kd_ki
  interface_cutoff: 4.5
  include_hydrogens: false
  water_policy: remove
  water_cutoff: 4.0
  strict_labels: true
  protein_spatial_cutoff: 5
